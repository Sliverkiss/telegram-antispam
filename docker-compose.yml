services:
  adbot:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # 关键变量从 .env 读取；下面给出安全默认值兜底（可在 .env 里覆盖）。
      - BOT_ADDR=${BOT_ADDR:-:3000}
      - BOT_TOKEN=${BOT_TOKEN:-}
      - BOT_CHATS=${BOT_CHATS:-}
      - BOT_LEAVE_OTHER_CHATS=${BOT_LEAVE_OTHER_CHATS:-true}
      - BOT_LEAVE_NOTICE=${BOT_LEAVE_NOTICE:-true}
      - BOT_ADMIN_USERS=${BOT_ADMIN_USERS:-}
      - BOT_DRY_RUN=${BOT_DRY_RUN:-false}
      - BOT_ACTION=${BOT_ACTION:-kick}
      - BOT_IGNORE_ADMINS=${BOT_IGNORE_ADMINS:-true}
      - BOT_DELETE_JOIN_MSG=${BOT_DELETE_JOIN_MSG:-false}
      - BOT_LOG_CHAT=${BOT_LOG_CHAT:-0}
      - BOT_CMD_AUTODELETE_SEC=${BOT_CMD_AUTODELETE_SEC:-0}
      - BOT_STORE=${BOT_STORE:-memory}
      - BOT_REDIS_URL=${BOT_REDIS_URL:-}
      - BOT_REDIS_INSECURE_TLS=${BOT_REDIS_INSECURE_TLS:-false}
      - BOT_DB_PATH=${BOT_DB_PATH:-data/adbot.db}
      - BOT_DB_FSYNC=${BOT_DB_FSYNC:-false}
      - BOT_RETENTION=${BOT_RETENTION:-72h}
      - BOT_RETENTION_SUSPECT=${BOT_RETENTION_SUSPECT:-}
      - BOT_RETENTION_SIGNATURE=${BOT_RETENTION_SIGNATURE:-}
      - BOT_RETENTION_SLIDING=${BOT_RETENTION_SLIDING:-true}
      - BOT_SWEEP_INTERVAL=${BOT_SWEEP_INTERVAL:-10m}
      - BOT_MAX_SUSPECTS=${BOT_MAX_SUSPECTS:-50000}
      - BOT_MAX_SIGNATURES=${BOT_MAX_SIGNATURES:-50000}
      - BOT_AI_BASE_URL=${BOT_AI_BASE_URL:-}
      - BOT_AI_API_KEY=${BOT_AI_API_KEY:-}
      - BOT_AI_MODELS=${BOT_AI_MODELS:-mimo-v2.6-pro-ultraspeed-studio,mimo-v2.6-pro,mimo-v2.6-flash}
      - BOT_AI_MODEL=${BOT_AI_MODEL:-mimo-v2.6-pro-ultraspeed-studio}
      - BOT_AI_TIMEOUT=${BOT_AI_TIMEOUT:-30s}
      - BOT_AI_RETRY_INTERVAL=${BOT_AI_RETRY_INTERVAL:-10s}
      - BOT_AI_RETRY_MAX_ATTEMPTS=${BOT_AI_RETRY_MAX_ATTEMPTS:-5}
      - BOT_AI_RETRY_QUEUE=${BOT_AI_RETRY_QUEUE:-500}
      - BOT_AI_MIN_CONFIDENCE=${BOT_AI_MIN_CONFIDENCE:-0.85}
      - BOT_AI_VERIFY_VOTES=${BOT_AI_VERIFY_VOTES:-3}
      - BOT_AI_VERIFY_MODELS=${BOT_AI_VERIFY_MODELS:-mimo-v2.6-flash}
      - BOT_AI_VERIFY_MAJORITY=${BOT_AI_VERIFY_MAJORITY:-2}
      - BOT_AI_VERIFY_TIMEOUT=${BOT_AI_VERIFY_TIMEOUT:-45s}
      - BOT_AI_REASONING_EFFORT=${BOT_AI_REASONING_EFFORT:-none}
      - BOT_AI_PROMPT_FILE=${BOT_AI_PROMPT_FILE:-}
      - BOT_AI_FALLBACK_BASE_URL=${BOT_AI_FALLBACK_BASE_URL:-}
      - BOT_AI_FALLBACK_API_KEY=${BOT_AI_FALLBACK_API_KEY:-}
      - BOT_AI_FALLBACK_MODELS=${BOT_AI_FALLBACK_MODELS:-}
      - BOT_SIMHASH_DISTANCE=${BOT_SIMHASH_DISTANCE:-3}
      - BOT_LOCAL_RULES_ENABLED=${BOT_LOCAL_RULES_ENABLED:-true}
      - BOT_LOCAL_RULE_THRESHOLD=${BOT_LOCAL_RULE_THRESHOLD:-3}
      - BOT_LOCAL_KEYWORDS=${BOT_LOCAL_KEYWORDS:-}
      - BOT_POLL_TIMEOUT=${BOT_POLL_TIMEOUT:-30}
      - BOT_WORKERS=${BOT_WORKERS:-4}
      - BOT_LOG_LEVEL=${BOT_LOG_LEVEL:-info}
      - BOT_LOG_FORMAT=${BOT_LOG_FORMAT:-text}
      - BOT_NOTIFY_ON_PUNISH=${BOT_NOTIFY_ON_PUNISH:-true}
      - BOT_NOTIFY_ON_ERROR=${BOT_NOTIFY_ON_ERROR:-true}
      - BOT_NOTIFY_LEVEL=${BOT_NOTIFY_LEVEL:-error}
      - BOT_NOTIFY_RATE=${BOT_NOTIFY_RATE:-20}
      - BOT_NOTIFY_QUEUE=${BOT_NOTIFY_QUEUE:-200}
      - BOT_NOTIFY_DEDUPE_WINDOW=${BOT_NOTIFY_DEDUPE_WINDOW:-5m}
      - BOT_NOTIFY_MAX_LEN=${BOT_NOTIFY_MAX_LEN:-1024}
      - BOT_NOTIFY_TEXT_LEN=${BOT_NOTIFY_TEXT_LEN:-120}
      - BOT_NOTIFY_INCLUDE_TEXT=${BOT_NOTIFY_INCLUDE_TEXT:-true}
      - BOT_NOTIFY_DRAIN=${BOT_NOTIFY_DRAIN:-5s}
      - BOT_ADMIN_CACHE_TTL=${BOT_ADMIN_CACHE_TTL:-5m}
      - BOT_ADMIN_CACHE_MAX=${BOT_ADMIN_CACHE_MAX:-5000}
      - BOT_ADMIN_TOKEN=${BOT_ADMIN_TOKEN:-}
      - BOT_VERSION=${BOT_VERSION:-dev}